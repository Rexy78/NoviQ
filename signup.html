<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Career Nova</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--bg-main), var(--bg-purple-light));
    }
    .auth-box {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-box animate-fade-in">
      <div style="text-align:center; margin-bottom:1.75rem;">
        <a href="/" class="brand-logo" style="justify-content:center; margin-bottom:1rem; padding:0;">
          <img src="/images/app-logo.jpg" alt="Application Logo" style="height: 56px; width: auto; max-width: 240px; border-radius: 12px; object-fit: contain; display: block; margin: 0 auto;" />
        </a>
        <h2 style="font-size:1.5rem; margin-bottom:0.25rem;">Create Your Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Start measuring and closing your skill gaps today</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="fullname">Full Name</label>
          <input type="text" id="fullname" class="form-control" placeholder="Alex Johnson" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="alex@example.com" required />
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" for="password">Password</label>
            <button type="button" id="toggle-pwd-btn" style="background:none;border:none;color:var(--primary-purple);font-size:0.8rem;cursor:pointer;font-weight:600;">Show</button>
          </div>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:0.85rem; margin-top:0.5rem;">
          <span>Create Account</span>
        </button>
      </form>

      <div style="text-align:center; margin-top:1.75rem; padding-top:1.25rem; border-top:1px solid var(--border-color); font-size:0.9rem; color:var(--text-muted); display:flex; flex-direction:column; gap:0.75rem; align-items:center;">
        <div>Already have an account? <a href="/login.html" style="font-weight:700;">Log in</a></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      const pwdInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm-password');
      const toggleBtn = document.getElementById('toggle-pwd-btn');
      const submitBtn = document.getElementById('submit-btn');

      toggleBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        confirmInput.type = isPwd ? 'text' : 'password';
        toggleBtn.textContent = isPwd ? 'Hide' : 'Show';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = pwdInput.value;
        const confirm = confirmInput.value;

        if (password !== confirm) {
          API.showToast('Passwords do not match', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Creating account...';

        try {
          await Auth.register(fullname, email, password, 'Software Professional');
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Create Account</span>';
        }
      });
    });
  </script>
</body>
</html>
